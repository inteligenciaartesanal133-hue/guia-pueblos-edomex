<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 296">
  <!-- Ajolote mascota saludando (recreado del diseño del usuario) -->
  <defs>
    <!-- Una branquia: forma de hoja con franja clara al centro -->
    <g id="br">
      <path d="M0 0 C-10 -14 -34 -20 -52 -12 C-44 -6 -38 -2 -34 2 C-42 6 -48 12 -50 18 C-30 18 -10 12 0 0 Z" fill="#E0357E" stroke="#5A1E3C" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-6 0 C-16 -6 -28 -8 -40 -6" fill="none" stroke="#F79BC0" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="petalo">
      <ellipse cx="0" cy="-11" rx="8" ry="11" fill="#EC4F8E" stroke="#5A1E3C" stroke-width="2.5"/>
      <ellipse cx="0" cy="-12" rx="3.5" ry="6" fill="#F7A3C4"/>
    </g>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- cola -->
    <path d="M84 250 C52 258 30 246 26 224 C40 236 60 238 86 232 Z" fill="#F6A6C2" stroke="#5A1E3C" stroke-width="3.5"/>

    <!-- mochila (detras del cuerpo) -->
    <path d="M58 172 C50 176 46 214 54 236 C62 246 80 246 86 238 L92 176 C82 168 66 168 58 172 Z" fill="#9A6236" stroke="#5A1E3C" stroke-width="3.5"/>
    <path d="M56 200 C64 206 80 206 88 200" fill="none" stroke="#5A1E3C" stroke-width="2.5"/>

    <!-- branquias izquierdas -->
    <use href="#br" transform="translate(70 70) rotate(40)"/>
    <use href="#br" transform="translate(58 98) rotate(8)"/>
    <use href="#br" transform="translate(62 124) rotate(-22)"/>
    <!-- branquias derechas (espejo) -->
    <use href="#br" transform="translate(178 66) scale(-1 1) rotate(40)"/>
    <use href="#br" transform="translate(192 94) scale(-1 1) rotate(8)"/>
    <use href="#br" transform="translate(188 120) scale(-1 1) rotate(-22)"/>

    <!-- falda -->
    <path d="M78 214 C104 224 150 224 176 212 L188 262 C150 278 100 278 66 264 Z" fill="#C2185B" stroke="#5A1E3C" stroke-width="3.5"/>
    <path d="M76 222 C104 232 150 232 178 220 L180 232 C150 244 104 244 74 234 Z" fill="#9E1048"/>
    <!-- pies -->
    <ellipse cx="104" cy="276" rx="16" ry="8" fill="#F8B4CB" stroke="#5A1E3C" stroke-width="3.5"/>
    <ellipse cx="150" cy="276" rx="16" ry="8" fill="#F8B4CB" stroke="#5A1E3C" stroke-width="3.5"/>

    <!-- blusa -->
    <path d="M86 150 C110 142 148 142 170 150 L180 216 C150 228 106 228 76 216 Z" fill="#FFFFFF" stroke="#5A1E3C" stroke-width="3.5"/>
    <!-- bordado del cuello -->
    <path d="M92 156 C112 164 146 164 164 156" fill="none" stroke="#E0357E" stroke-width="2.5" stroke-dasharray="1 5"/>
    <g stroke="none">
      <g transform="translate(106 172)"><circle r="6" fill="#D6204F"/><circle r="2.4" fill="#F2B705"/></g>
      <g transform="translate(128 176)"><circle r="7" fill="#EC4F8E"/><circle r="2.8" fill="#F2B705"/></g>
      <g transform="translate(150 172)"><circle r="6" fill="#D6204F"/><circle r="2.4" fill="#F2B705"/></g>
      <ellipse cx="117" cy="180" rx="5" ry="2.4" fill="#3F8A3A" transform="rotate(30 117 180)"/>
      <ellipse cx="139" cy="180" rx="5" ry="2.4" fill="#3F8A3A" transform="rotate(-30 139 180)"/>
      <ellipse cx="96" cy="178" rx="4" ry="2" fill="#3F8A3A" transform="rotate(-40 96 178)"/>
      <ellipse cx="160" cy="178" rx="4" ry="2" fill="#3F8A3A" transform="rotate(40 160 178)"/>
      <circle cx="128" cy="196" r="3" fill="#6D2468"/><circle cx="114" cy="200" r="2.4" fill="#F2B705"/><circle cx="142" cy="200" r="2.4" fill="#F2B705"/>
    </g>

    <!-- tirantes de la mochila -->
    <path d="M92 150 C96 172 98 194 100 214" fill="none" stroke="#9A6236" stroke-width="10"/>
    <path d="M92 150 C96 172 98 194 100 214" fill="none" stroke="#5A1E3C" stroke-width="2" stroke-dasharray="2 7"/>
    <path d="M166 150 C164 170 160 190 158 212" fill="none" stroke="#9A6236" stroke-width="10"/>

    <!-- manga izquierda abombada + brazo hacia abajo -->
    <path d="M78 170 C70 196 74 216 84 222 C92 214 94 196 92 176 Z" fill="#F8B4CB" stroke="#5A1E3C" stroke-width="3.5"/>
    <path d="M90 148 C72 148 64 160 66 172 C70 182 86 184 96 176 Z" fill="#FFFFFF" stroke="#5A1E3C" stroke-width="3.5"/>
    <path d="M68 174 c4 3 8 3 12 0 c4 3 8 3 12 0" fill="none" stroke="#E0357E" stroke-width="2.4"/>

    <!-- cabeza -->
    <path d="M52 100 C52 54 86 34 126 34 C168 34 200 56 200 98 C200 140 166 158 126 158 C84 158 52 142 52 100 Z" fill="#F8B4CB" stroke="#5A1E3C" stroke-width="3.5"/>
    <!-- brillo suave en la frente -->
    <ellipse cx="112" cy="54" rx="26" ry="9" fill="#FCD3E0" stroke="none"/>

    <!-- flor en la cabeza -->
    <g transform="translate(88 50)">
      <ellipse cx="-14" cy="12" rx="10" ry="5" fill="#3F8A3A" stroke="#5A1E3C" stroke-width="2.5" transform="rotate(-30 -14 12)"/>
      <ellipse cx="16" cy="12" rx="10" ry="5" fill="#3F8A3A" stroke="#5A1E3C" stroke-width="2.5" transform="rotate(30 16 12)"/>
      <use href="#petalo"/>
      <use href="#petalo" transform="rotate(72)"/>
      <use href="#petalo" transform="rotate(144)"/>
      <use href="#petalo" transform="rotate(216)"/>
      <use href="#petalo" transform="rotate(288)"/>
      <circle r="7" fill="#F2B705" stroke="#5A1E3C" stroke-width="2.5"/>
      <circle r="2.5" fill="#E8820C" stroke="none"/>
    </g>

    <!-- mejillas -->
    <ellipse cx="86" cy="118" rx="13" ry="8" fill="#F27BA5" opacity=".7" stroke="none"/>
    <ellipse cx="168" cy="114" rx="13" ry="8" fill="#F27BA5" opacity=".7" stroke="none"/>
    <!-- ojo abierto -->
    <ellipse cx="100" cy="98" rx="11" ry="13" fill="#2A0F1F" stroke="none"/>
    <circle cx="104" cy="92" r="4.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="97" cy="104" r="2" fill="#FFFFFF" stroke="none"/>
    <!-- ojo guiñando -->
    <path d="M144 100 C150 90 162 90 166 100" fill="none" stroke="#2A0F1F" stroke-width="4.5"/>
    <!-- boca abierta y feliz -->
    <path d="M114 112 C120 112 136 112 144 110 C144 126 136 136 128 136 C120 136 114 126 114 112 Z" fill="#9E1048" stroke="#5A1E3C" stroke-width="3.2"/>
    <path d="M118 128 C122 122 134 122 138 128 C134 134 122 134 118 128 Z" fill="#F27BA5" stroke="none"/>
    <!-- brazo derecho saludando (encima de la cabeza para que se vea) -->
    <path d="M166 158 C184 150 204 136 214 112 C222 112 230 118 228 128 C220 148 200 166 178 178 Z" fill="#F8B4CB" stroke="#5A1E3C" stroke-width="3.5"/>
    <g transform="translate(14 4)">
      <path d="M200 112 C196 100 198 90 204 88 C206 82 214 80 216 86 C222 82 230 86 228 94 C234 96 236 104 230 110 C226 118 214 120 206 118 Z" fill="#F8B4CB" stroke="#5A1E3C" stroke-width="3.5"/>
      <path d="M210 92 L212 104 M219 92 L218 104 M226 99 L222 107" stroke="#5A1E3C" stroke-width="2.2" fill="none"/>
    </g>
    <!-- manga derecha -->
    <path d="M164 146 C182 144 192 156 188 168 C184 178 168 180 160 172 Z" fill="#FFFFFF" stroke="#5A1E3C" stroke-width="3.5"/>
    <path d="M168 176 c4 -3 8 -3 12 0 c3 -3 6 -3 9 -1" fill="none" stroke="#E0357E" stroke-width="2.4"/>
  </g>
</svg>
