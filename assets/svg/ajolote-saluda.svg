    <path d="M150 44 q6 -4 12 0" fill="none" stroke="#4A1530" stroke-width="2"/>

    <!-- flor en la cabeza -->
    <g transform="translate(86 50)">
      <path d="M-26 6 C-34 -4 -22 -14 -12 -6 Z M22 14 C32 8 34 22 22 24 Z M-20 22 C-30 26 -28 36 -16 30 Z" fill="#3F8A3A" stroke="#4A1530" stroke-width="2.5"/>
      <g transform="translate(-40 -40)">
        <path d="M40 40 C26 30 26 12 40 10 C54 12 54 30 40 40 Z" fill="url(#petalo-color)" stroke="#4A1530" stroke-width="2.5" transform="rotate(0 40 40)"/>
        <path d="M40 40 C26 30 26 12 40 10 C54 12 54 30 40 40 Z" fill="url(#petalo-color)" stroke="#4A1530" stroke-width="2.5" transform="rotate(72 40 40)"/>
        <path d="M40 40 C26 30 26 12 40 10 C54 12 54 30 40 40 Z" fill="url(#petalo-color)" stroke="#4A1530" stroke-width="2.5" transform="rotate(144 40 40)"/>
        <path d="M40 40 C26 30 26 12 40 10 C54 12 54 30 40 40 Z" fill="url(#petalo-color)" stroke="#4A1530" stroke-width="2.5" transform="rotate(216 40 40)"/>
        <path d="M40 40 C26 30 26 12 40 10 C54 12 54 30 40 40 Z" fill="url(#petalo-color)" stroke="#4A1530" stroke-width="2.5" transform="rotate(288 40 40)"/>
      </g>
      <circle r="7" fill="#F6E27A" stroke="#4A1530" stroke-width="2.5"/>
      <circle r="2.8" fill="#C2185B" stroke="none"/>
    </g>

    <!-- mejillas -->
    <ellipse cx="86" cy="120" rx="14" ry="9" fill="#F27BA5" opacity=".75" stroke="none"/>
    <ellipse cx="170" cy="114" rx="14" ry="9" fill="#F27BA5" opacity=".75" stroke="none"/>
    <!-- nariz -->
    <circle cx="122" cy="104" r="1.8" fill="#4A1530" stroke="none"/><circle cx="136" cy="103" r="1.8" fill="#4A1530" stroke="none"/>
    <!-- ojo abierto -->
    <ellipse cx="100" cy="98" rx="11" ry="13" fill="#2A0F1F" stroke="none"/>
    <circle cx="104" cy="92" r="4.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="97" cy="104" r="2" fill="#FFFFFF" stroke="none"/>
    <path d="M89 90 l-5 -4" stroke="#2A0F1F" stroke-width="2.6"/>
    <!-- ojo guiñando -->
    <path d="M148 98 C152 88 164 88 168 96" fill="none" stroke="#2A0F1F" stroke-width="4.5"/>
    <!-- boca abierta y feliz -->
    <path d="M112 114 C122 116 138 116 148 112 C148 130 138 140 130 140 C120 140 112 130 112 114 Z" fill="#9E1048" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M118 132 C122 125 136 125 142 132 C136 138 124 138 118 132 Z" fill="#F27BA5" stroke="none"/>
    <!-- brazo derecho saludando (encima de la cabeza para que se vea) -->
    <path d="M166 162 C186 152 206 138 216 112 C224 112 232 118 230 128 C222 150 202 168 178 180 Z" fill="#F9B9CD" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M214 112 C210 100 212 90 218 88 C220 82 228 80 230 86 C236 82 244 86 242 94 C248 96 250 104 244 110 C240 118 228 120 220 118 Z" fill="#F9B9CD" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M224 92 L226 104 M233 92 L232 104 M240 99 L236 107" stroke="#4A1530" stroke-width="2.2" fill="none"/>
    <!-- manga derecha -->
    <path d="M164 146 C182 144 194 156 190 170 C186 180 168 182 160 174 Z" fill="#FFFFFF" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M168 178 c4 -3 8 -3 12 0 c3 -3 6 -3 9 -1" fill="none" stroke="#E0357E" stroke-width="2.4"/>
  </g>
</svg>
