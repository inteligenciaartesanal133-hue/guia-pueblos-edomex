<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 312">
  <!-- Ajolote mascota saludando (recreado del diseño del usuario) -->
  <defs>
    <g id="br">
      <path d="M0 0 L-0.0 -0.0 L-3.2 -7.0 L-6.4 -5.8 L-9.7 -12.3 L-12.9 -10.4 L-16.1 -16.0 L-19.3 -13.2 L-22.6 -17.8 L-25.8 -13.9 L-29.0 -17.4 L-32.2 -12.5 L-35.4 -15.2 L-38.7 -9.5 L-41.9 -11.5 L-45.1 -5.4 L-48.3 -7.1 L-51.6 -0.8 L-54.8 -4.0 L-58.0 -0.0 L-58.0 0.0 L-54.8 4.0 L-51.6 0.8 L-48.3 7.1 L-45.1 5.4 L-41.9 11.5 L-38.7 9.5 L-35.4 15.2 L-32.2 12.5 L-29.0 17.4 L-25.8 13.9 L-22.6 17.8 L-19.3 13.2 L-16.1 16.0 L-12.9 10.4 L-9.7 12.3 L-6.4 5.8 L-3.2 7.0 L-0.0 0.0 Z" fill="#D81B60" stroke="#4A1530" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-4 0 C-18 -2 -34 -2 -46 0" fill="none" stroke="#F7A1C0" stroke-width="7" stroke-linecap="round"/>
    </g>
    <radialGradient id="petalo-color" cx="40" cy="40" r="30" gradientUnits="userSpaceOnUse">
      <stop offset=".25" stop-color="#F7931E"/><stop offset=".6" stop-color="#F0567F"/><stop offset="1" stop-color="#E23A72"/>
    </radialGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- cola ondulada -->
    <path d="M86 236 C60 232 40 246 22 238 C10 232 8 248 18 256 C30 266 52 262 66 270 C80 278 94 270 98 258 Z" fill="#F7A6C1" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M30 248 C46 252 62 250 82 254" fill="none" stroke="#FBD0DE" stroke-width="4"/>

    <!-- mochila (detras del cuerpo) -->
    <path d="M60 176 C50 182 46 222 54 244 C62 254 82 254 88 246 L94 180 C84 172 68 172 60 176 Z" fill="#A0682F" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M56 208 C64 214 80 214 90 208" fill="none" stroke="#4A1530" stroke-width="2.5"/>

    <!-- branquias izquierdas -->
    <use href="#br" transform="translate(72 66) rotate(42)"/>
    <use href="#br" transform="translate(60 96) rotate(8)"/>
    <use href="#br" transform="translate(64 124) rotate(-24)"/>
    <!-- branquias derechas (espejo) -->
    <use href="#br" transform="translate(180 64) scale(-1 1) rotate(42)"/>
    <use href="#br" transform="translate(194 92) scale(-1 1) rotate(8)"/>
    <use href="#br" transform="translate(190 120) scale(-1 1) rotate(-24)"/>

    <!-- pies -->
    <path d="M90 286 C90 276 118 276 118 286 C118 294 90 294 90 286 Z" fill="#F9B9CD" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M140 286 C140 276 168 276 168 286 C168 294 140 294 140 286 Z" fill="#F9B9CD" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M98 292 v-4 M106 293 v-4 M148 292 v-4 M156 293 v-4" stroke="#4A1530" stroke-width="2"/>

    <!-- falda con olanes -->
    <path d="M78 230 C104 240 152 240 178 228 L192 270 Q184 280 176 272 Q168 282 158 274 Q148 284 138 276 Q128 286 118 276 Q108 284 98 274 Q88 282 80 272 Q70 280 64 270 Z" fill="#C2185B" stroke="#4A1530" stroke-width="3.5"/>
    <path d="M100 248 L96 270 M128 250 V276 M156 248 L160 270" stroke="#9E1048" stroke-width="2.5"/>

    <!-- blusa -->
    <path d="M86 150 C110 142 148 142 170 150 L182 230 C150 244 106 244 74 230 Z" fill="#FFFFFF" stroke="#4A1530" stroke-width="3.5"/>
