<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="t">
  <title id="t">Propuesta C: ajolote estilo bordado</title>
  <!-- Estilo "hilo": rellenos claros y contornos de puntada (lineas punteadas de colores) -->
  <defs>
    <g id="pluma">
      <path d="M0 0 Q-18 -14 -40 -6 Q-22 6 0 0 Z" fill="#FCEAF0" stroke="#C2185B" stroke-width="3" stroke-dasharray="5 3"/>
      <path d="M-6 -2 L-32 -5" stroke="#6D2468" stroke-width="2" stroke-dasharray="3 3"/>
    </g>
    <g id="lado">
      <use href="#pluma" transform="translate(54 74) rotate(20)"/>
      <use href="#pluma" transform="translate(48 100) rotate(-4)"/>
      <use href="#pluma" transform="translate(54 126) rotate(-26)"/>
    </g>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- cola -->
    <path d="M80 232 C46 238 30 222 30 204 C44 216 60 218 82 214" fill="#FCEAF0" stroke="#C2185B" stroke-width="3" stroke-dasharray="5 3"/>
    <use href="#lado"/>
    <use href="#lado" transform="translate(240 0) scale(-1 1)"/>
    <!-- falda -->
    <path d="M70 208 Q120 222 170 208 L180 250 Q120 266 60 250 Z" fill="#FFF7EE" stroke="#3F6A2A" stroke-width="3" stroke-dasharray="5 3"/>
    <!-- motivo tenango: pajaritos y flores en la falda -->
    <g stroke-width="2.4">
      <path d="M84 236 q6 -10 14 -4 q-2 8 -10 8 l-6 4" stroke="#C2185B"/>
      <circle cx="92" cy="231" r="1.5" fill="#3B1A2E" stroke="none"/>
      <path d="M156 236 q-6 -10 -14 -4 q2 8 10 8 l6 4" stroke="#6D2468"/>
      <circle cx="148" cy="231" r="1.5" fill="#3B1A2E" stroke="none"/>
      <g stroke="#E8820C"><path d="M120 226 v18"/><path d="M112 234 h16"/><path d="M114 228 l12 12"/><path d="M126 228 l-12 12"/></g>
    </g>
    <!-- blusa -->
    <path d="M80 150 Q120 140 160 150 L172 212 Q120 226 68 212 Z" fill="#FFFFFF" stroke="#3B1A2E" stroke-width="3" stroke-dasharray="5 3"/>
    <g stroke-width="2.4">
      <path d="M86 160 q34 -12 68 0" stroke="#F2B705" stroke-dasharray="4 3"/>
      <path d="M96 176 q8 -10 16 0 q-8 10 -16 0" stroke="#3F6A2A"/>
      <path d="M128 176 q8 -10 16 0 q-8 10 -16 0" stroke="#3F6A2A"/>
      <circle cx="120" cy="188" r="6" stroke="#C2185B"/><circle cx="120" cy="188" r="2" fill="#F2B705" stroke="none"/>
    </g>
    <!-- tirante -->
    <path d="M90 150 L102 212" stroke="#8A5A3B" stroke-width="5" stroke-dasharray="6 3"/>
    <!-- brazos -->
    <path d="M74 166 Q56 186 64 206" stroke="#C2185B" stroke-width="3" stroke-dasharray="5 3"/>
    <path d="M166 164 Q186 150 192 128" stroke="#C2185B" stroke-width="3" stroke-dasharray="5 3"/>
    <circle cx="196" cy="120" r="10" fill="#FCEAF0" stroke="#C2185B" stroke-width="3" stroke-dasharray="5 3"/>
    <!-- cabeza -->
    <ellipse cx="120" cy="98" rx="74" ry="56" fill="#FCEAF0" stroke="#C2185B" stroke-width="3.4" stroke-dasharray="6 3"/>
    <!-- flor tenango en la cabeza -->
    <g transform="translate(160 52)" stroke-width="2.4">
      <path d="M0 -12 q8 6 0 12 q-8 -6 0 -12" stroke="#E8820C"/>
      <path d="M12 0 q-6 8 -12 0 q6 -8 12 0" stroke="#6D2468"/>
      <path d="M0 12 q-8 -6 0 -12 q8 6 0 12" stroke="#E8820C"/>
      <path d="M-12 0 q6 -8 12 0 q-6 8 -12 0" stroke="#6D2468"/>
    </g>
    <!-- cara -->
    <g stroke="#E85A8C" stroke-width="2" stroke-dasharray="2 2"><circle cx="80" cy="116" r="8"/><circle cx="160" cy="116" r="8"/></g>
    <circle cx="94" cy="98" r="9" fill="#3B1A2E"/><circle cx="97" cy="94" r="3" fill="#fff"/>
    <circle cx="146" cy="98" r="9" fill="#3B1A2E"/><circle cx="149" cy="94" r="3" fill="#fff"/>
    <path d="M106 118 Q120 132 134 118" stroke="#3B1A2E" stroke-width="3.4"/>
  </g>
</svg>
