<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="t">
  <title id="t">Propuesta A: ajolote tierno con contorno</title>
  <defs>
    <!-- Una branquia (se usa 3 veces por lado) -->
    <g id="branquia">
      <ellipse cx="0" cy="0" rx="28" ry="12" fill="#E8578A" stroke="#3B1A2E" stroke-width="4"/>
      <ellipse cx="-4" cy="-2" rx="15" ry="5" fill="#F7A6C2"/>
    </g>
    <g id="branquias">
      <use href="#branquia" transform="translate(40 66) rotate(-32)"/>
      <use href="#branquia" transform="translate(30 96) rotate(-4)"/>
      <use href="#branquia" transform="translate(40 126) rotate(26)"/>
    </g>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- cola -->
    <path d="M78 236 C40 240 22 222 26 200 C40 214 58 218 82 214 Z" fill="#F6A9C1" stroke="#3B1A2E" stroke-width="4"/>
    <!-- branquias -->
    <use href="#branquias"/>
    <use href="#branquias" transform="translate(240 0) scale(-1 1)"/>
    <!-- pies -->
    <ellipse cx="96" cy="260" rx="16" ry="9" fill="#F9B8CC" stroke="#3B1A2E" stroke-width="4"/>
    <ellipse cx="144" cy="260" rx="16" ry="9" fill="#F9B8CC" stroke="#3B1A2E" stroke-width="4"/>
    <!-- falda -->
    <path d="M70 208 Q120 222 170 208 L180 250 Q120 266 60 250 Z" fill="#C2185B" stroke="#3B1A2E" stroke-width="4"/>
    <path d="M66 236 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l8 -5" fill="none" stroke="#F2B705" stroke-width="3"/>
    <!-- blusa -->
    <path d="M80 150 Q120 140 160 150 L172 212 Q120 226 68 212 Z" fill="#FFFFFF" stroke="#3B1A2E" stroke-width="4"/>
    <!-- bordado de la blusa -->
    <g stroke="none">
      <circle cx="96" cy="160" r="5" fill="#C2185B"/><circle cx="96" cy="160" r="2" fill="#F2B705"/>
      <circle cx="120" cy="156" r="6" fill="#6D2468"/><circle cx="120" cy="156" r="2.4" fill="#F2B705"/>
      <circle cx="144" cy="160" r="5" fill="#C2185B"/><circle cx="144" cy="160" r="2" fill="#F2B705"/>
      <ellipse cx="108" cy="166" rx="4" ry="2" fill="#3F6A2A" transform="rotate(-25 108 166)"/>
      <ellipse cx="132" cy="166" rx="4" ry="2" fill="#3F6A2A" transform="rotate(25 132 166)"/>
      <circle cx="120" cy="190" r="4" fill="#E8820C"/><circle cx="104" cy="196" r="3" fill="#C2185B"/><circle cx="136" cy="196" r="3" fill="#6D2468"/>
    </g>
    <!-- tirante de la mochila -->
    <path d="M90 150 L102 212" fill="none" stroke="#8A5A3B" stroke-width="9"/>
    <path d="M90 150 L102 212" fill="none" stroke="#3B1A2E" stroke-width="2" stroke-dasharray="1 6"/>
    <!-- brazo izquierdo -->
    <ellipse cx="70" cy="186" rx="12" ry="24" fill="#F9B8CC" stroke="#3B1A2E" stroke-width="4" transform="rotate(18 70 186)"/>
    <!-- brazo derecho saludando -->
    <ellipse cx="178" cy="150" rx="12" ry="28" fill="#F9B8CC" stroke="#3B1A2E" stroke-width="4" transform="rotate(38 178 150)"/>
    <circle cx="194" cy="126" r="13" fill="#F9B8CC" stroke="#3B1A2E" stroke-width="4"/>
    <!-- cabeza -->
    <ellipse cx="120" cy="98" rx="76" ry="58" fill="#F9B8CC" stroke="#3B1A2E" stroke-width="4"/>
    <!-- flor de cempasuchil -->
    <g transform="translate(160 50)">
      <circle r="15" fill="#E8820C" stroke="#3B1A2E" stroke-width="3"/>
      <circle r="10" fill="#F2B705"/>
      <circle r="4" fill="#E8820C"/>
    </g>
    <!-- cara -->
    <ellipse cx="80" cy="116" rx="11" ry="6" fill="#F07FA4" opacity=".75"/>
    <ellipse cx="160" cy="116" rx="11" ry="6" fill="#F07FA4" opacity=".75"/>
    <circle cx="94" cy="98" r="10" fill="#3B1A2E"/><circle cx="97" cy="94" r="3.5" fill="#fff"/>
    <circle cx="146" cy="98" r="10" fill="#3B1A2E"/><circle cx="149" cy="94" r="3.5" fill="#fff"/>
    <path d="M106 118 Q120 134 134 118 Z" fill="#B3264F" stroke="#3B1A2E" stroke-width="3.5"/>
  </g>
</svg>
