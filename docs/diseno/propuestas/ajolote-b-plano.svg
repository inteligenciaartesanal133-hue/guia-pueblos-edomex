<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="t">
  <title id="t">Propuesta B: ajolote plano geométrico</title>
  <defs>
    <!-- Branquias como hojas puntiagudas, sin contorno -->
    <g id="hoja">
      <path d="M0 0 Q-20 -12 -40 0 Q-20 12 0 0 Z" fill="#D9437A"/>
      <path d="M0 0 Q-16 -5 -32 0 Q-16 5 0 0 Z" fill="#EE7BA3"/>
    </g>
    <g id="lado">
      <use href="#hoja" transform="translate(56 70) rotate(28)"/>
      <use href="#hoja" transform="translate(50 98)"/>
      <use href="#hoja" transform="translate(56 126) rotate(-28)"/>
    </g>
  </defs>
  <!-- sombra en el piso -->
  <ellipse cx="120" cy="266" rx="70" ry="8" fill="#3B1A2E" opacity=".12"/>
  <!-- cola -->
  <path d="M80 230 L28 214 L84 206 Z" fill="#F0A0BB"/>
  <use href="#lado"/>
  <use href="#lado" transform="translate(240 0) scale(-1 1)"/>
  <!-- cuerpo: falda trapecio + blusa -->
  <path d="M66 210 L174 210 L186 256 L54 256 Z" fill="#C2185B"/>
  <path d="M54 246 H186 V256 H54 Z" fill="#A3124B"/>
  <g fill="#F2B705">
    <path d="M70 230 l8 -8 l8 8 l-8 8 Z"/><path d="M102 230 l8 -8 l8 8 l-8 8 Z"/>
    <path d="M134 230 l8 -8 l8 8 l-8 8 Z"/><path d="M166 230 l6 -6 l6 6 l-6 6 Z"/>
  </g>
  <path d="M78 148 H162 L172 212 H68 Z" fill="#FFFFFF"/>
  <path d="M78 148 H162 L164 162 H76 Z" fill="#3F6A2A"/>
  <g fill="#F2B705"><circle cx="92" cy="155" r="3"/><circle cx="108" cy="155" r="3"/><circle cx="124" cy="155" r="3"/><circle cx="140" cy="155" r="3"/><circle cx="156" cy="155" r="3"/></g>
  <path d="M120 172 l10 10 l-10 10 l-10 -10 Z" fill="#6D2468"/>
  <circle cx="120" cy="182" r="3.5" fill="#F2B705"/>
  <!-- mochila: tirante plano -->
  <path d="M86 148 L94 148 L106 212 L98 212 Z" fill="#8A5A3B"/>
  <!-- brazos -->
  <path d="M68 168 Q54 190 62 206 Q72 196 76 176 Z" fill="#F6AFC6"/>
  <path d="M166 166 Q186 150 190 124 Q200 132 194 150 Q184 168 172 178 Z" fill="#F6AFC6"/>
  <circle cx="196" cy="120" r="11" fill="#F6AFC6"/>
  <!-- cabeza: forma redonda con sombra plana -->
  <path d="M44 100 Q44 40 120 40 Q196 40 196 100 Q196 152 120 152 Q44 152 44 100 Z" fill="#F9B8CC"/>
  <path d="M44 100 Q44 152 120 152 Q196 152 196 100 Q186 140 120 140 Q54 140 44 100 Z" fill="#F0A0BB"/>
  <!-- cara -->
  <circle cx="92" cy="96" r="8" fill="#3B1A2E"/><rect x="92" y="88" width="4" height="4" fill="#fff"/>
  <circle cx="148" cy="96" r="8" fill="#3B1A2E"/><rect x="148" y="88" width="4" height="4" fill="#fff"/>
  <path d="M110 114 H130 L120 124 Z" fill="#A3124B"/>
  <circle cx="76" cy="114" r="8" fill="#EE7BA3"/><circle cx="164" cy="114" r="8" fill="#EE7BA3"/>
  <!-- flor geometrica -->
  <g transform="translate(160 46)">
    <path d="M0 -14 L4 -4 L14 0 L4 4 L0 14 L-4 4 L-14 0 L-4 -4 Z" fill="#E8820C"/>
    <circle r="5" fill="#F2B705"/>
  </g>
</svg>
